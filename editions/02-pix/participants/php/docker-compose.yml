networks:
  app-network:
    driver: bridge

services:
  api:
    build: .
    ports:
      - "${APP_PORT:-3003}:3000"
    environment:
      - PORT=3000
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:kZM6H5vJk9wV3Zc5FQ8VpQaKk1n1WcJ6vI8P3sQ9xYw=
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=rinha
      - DB_USERNAME=rinha
      - DB_PASSWORD=rinha
      - CACHE_STORE=array
      - SESSION_DRIVER=array
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2GB"
    networks:
      - app-network

  worker:
    build: .
    command: ["php", "artisan", "pix:worker", "--batch=25", "--sleep=25"]
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:kZM6H5vJk9wV3Zc5FQ8VpQaKk1n1WcJ6vI8P3sQ9xYw=
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=rinha
      - DB_USERNAME=rinha
      - DB_PASSWORD=rinha
      - CACHE_STORE=array
      - SESSION_DRIVER=array
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1GB"
    networks:
      - app-network

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=rinha
      - POSTGRES_PASSWORD=rinha
      - POSTGRES_DB=rinha
    volumes:
      - ${EDITION_PATH:-../..}/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha"]
      interval: 2s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1GB"
    networks:
      - app-network
